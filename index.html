    <!-- Apply a remembered theme before first paint; otherwise follow the OS. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var pinned = stored === 'dark' || stored === 'light'
          var theme = pinned
            ? stored
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          if (pinned) document.querySelector('meta[name="color-scheme"]').content = theme
          document.querySelector('meta[name="theme-color"]').content =
            theme === 'dark' ? '#08080c' : '#f8f7f4'
        } catch (e) {}
      })()
    </script>
