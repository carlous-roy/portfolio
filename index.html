<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- SEO -->
    <title>Roy Carlous | AI Software Engineer</title>
    <meta
      name="description"
      content="Roy Carlous Christudass. AI Software Engineer working on machine learning, data and backend systems, built end to end. MS Computer Science, Wright State University. Four systems live and publicly reachable."
    />
    <meta name="author" content="Roy Carlous Christudass" />
    <meta name="theme-color" content="#08080c" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply a remembered theme before first paint; otherwise follow the OS. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var pinned = stored === 'dark' || stored === 'light'
          var theme = pinned
            ? stored
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          if (pinned) document.querySelector('meta[name="color-scheme"]').content = theme
          document.querySelector('meta[name="theme-color"]').content =
            theme === 'dark' ? '#08080c' : '#f8f7f4'
        } catch (e) {}
      })()
    </script>
    <style>
      html[data-theme='dark'] {
        background: #08080c;
      }
      html[data-theme='light'] {
        background: #f8f7f4;
      }
      body {
        margin: 0;
      }
    </style>
